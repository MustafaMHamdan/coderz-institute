
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة تعريف المدرب</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="profile-card">

        <img
            src="./images/trainer.png"
            alt="صورة المدرب أحمد خالد"
            class="trainer-image"
        >

        <div class="profile-info">

            <h1>أحمد خالد</h1>

            <h2>مدرب تطوير الويب</h2>

            <p class="description">
                أساعدك تتعلم بناء صفحات واضحة ومنظمة خطوة بخطوة.
            </p>

            <div class="skills">
                <span>HTML</span>
                <span>CSS</span>
                <span>Git</span>
            </div>

            <div class="buttons">
                <a  class="btn primary">شاهد الدورات</a>
                <a class="btn secondary">تواصل معي</a>
            </div>

        </div>

    </main>

</body>
</html>
