
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواعيد اللقاءات</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <header class="page-header">
            <h1>مواعيد اللقاءات</h1>
            <p>تابع لقاءاتك القادمة واستعد للتطبيق.</p>
        </header>

        <section class="meetings">

            <article class="meeting-card first">
                <span class="badge">اللقاء القادم</span>

                <h2>أساسيات HTML</h2>

                <p>ترتب محتوى الصفحة وتستخدم العناصر المناسبة.</p>

                <p class="schedule">السبت - 10:00 صباحا</p>

                <button>تفاصيل اللقاء</button>
            </article>

            <article class="meeting-card second">
                <span class="badge">الأسبوع القادم</span>

                <h2>تنسيق الصفحات باستخدام CSS</h2>

                <p>ننسّق النصوص والألوان ونضبط المسافات.</p>

                <p class="schedule">الاثنين - 5:00 مساء</p>

                <button>تفاصيل اللقاء</button>
            </article>

        </section>

    </main>

</body>
</html>
